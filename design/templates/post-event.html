<!doctype html><html><head><meta charset="utf-8"><title>UTIP event post</title>
<link rel="stylesheet" href="base.css"><script src="fill.js"></script>
<style>
.card { margin-top: 50px; background: var(--cream); color: var(--teal-dark); border-radius: 36px; padding: 44px 50px; }
.card .d { font-family: var(--display); font-weight: 900; font-size: 76px; color: var(--orange); }
.card .m { font-size: 40px; font-weight: 600; margin-top: 10px; }
</style></head><body>
<section class="slide bg-teal" data-slide="event">
  <img class="peek" src="../../brand/logo-icon.svg" alt="" style="width:480px;height:480px;right:-170px;bottom:-170px">
  <div class="kicker" style="color:var(--ball)" data-k="event.kind"></div>
  <div class="h1" style="margin:30px 0 0;max-width:820px" data-k="event.title"></div>
  <div class="card"><div class="d" data-k="event.date_label"></div><div class="m" data-k="event.time_label"></div><div class="m" data-k="event.location"></div></div>
  <div class="body" style="margin-top:40px" data-k="event.blurb"></div>
  <div class="foot"><span class="pill ball">RSVP: <span data-href="club.links.hub"></span> &middot; tap the link in our story</span></div>
</section>
<section class="slide bg-orange" data-slide="generic">
  <img class="peek" src="../../brand/logo-icon.svg" alt="" style="width:620px;height:620px;right:-190px;bottom:-190px">
  <div class="kicker">UTIP events</div>
  <div class="h1" style="margin:30px 0 40px;font-size:150px;line-height:.92">New event!</div>
  <div class="lead" style="max-width:780px">Pickleball, socials &amp; culture nights. International and domestic students, all levels welcome.</div>
  <div class="card" style="max-width:760px"><div class="d">Date, time &amp; place</div><div class="m">are in the caption 👇</div></div>
  <div class="foot"><span class="pill ball">RSVP: <span data-href="club.links.hub"></span> &middot; link in bio</span></div>
</section>
</body></html>
